<!DOCTYPE html>
<html lang="pt-BR" class="h-full scroll-smooth" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vida Sênior - Assistente Acessível</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

</head>
<body class="bg-slate-100 text-slate-900 min-h-full flex flex-col font-sans transition-all duration-200" id="main-body">

    <!-- BARRA SUPERIOR DE ACESSIBILIDADE -->
    <div class="bg-slate-900 text-white px-4 py-2 border-b border-slate-700">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-2 text-sm font-bold">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-universal-access text-amber-400 text-lg"></i>
                <span>Acessibilidade:</span>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="changeFontSize(0.1)" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-xl border border-slate-600 flex items-center gap-1 active:scale-95" title="Aumentar Texto">
                    <i class="fa-solid fa-plus text-xs"></i> Texto
                </button>
                <button onclick="changeFontSize(-0.1)" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-xl border border-slate-600 flex items-center gap-1 active:scale-95" title="Diminuir Texto">
                    <i class="fa-solid fa-minus text-xs"></i> Texto
                </button>
                <button onclick="toggleContrast()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 px-3 py-1.5 rounded-xl font-black flex items-center gap-1 active:scale-95">
                    <i class="fa-solid fa-circle-half-stroke"></i> Contraste
                </button>
                <button onclick="speakPageSummary()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-xl font-bold flex items-center gap-1 active:scale-95">
                    <i class="fa-solid fa-volume-high"></i> Ouvir
                </button>
            </div>
        </div>
    </div>

    <!-- CABEÇALHO PRINCIPAL -->
    <header class="bg-blue-900 text-white shadow-md sticky top-0 z-30 border-b-4 border-blue-600">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <div class="bg-red-500 text-white p-3 rounded-2xl flex items-center justify-center shadow">
                    <i class="fa-solid fa-heart-pulse text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl md:text-3xl font-black tracking-tight leading-none">VIDA SÊNIOR</h1>
                    <p class="text-xs md:text-sm font-semibold text-blue-200 mt-1">Seu painel diário de saúde e contatos</p>
                </div>
            </div>

            <!-- Data Atual -->
            <div class="bg-blue-800 text-blue-100 font-bold px-4 py-2 rounded-xl text-sm border border-blue-700 flex items-center gap-2 shadow-inner">
                <i class="fa-solid fa-calendar-day text-amber-400 text-base"></i>
                <span id="current-date-display">Carregando data...</span>
            </div>
        </div>

        <!-- ABAS DE NAVEGAÇÃO / FILTROS -->
        <div class="bg-blue-950 px-4 py-2 border-t border-blue-800">
            <div class="max-w-7xl mx-auto flex gap-2 overflow-x-auto pb-1">
                <button onclick="filterCategory('all')" id="tab-all" class="tab-btn active px-4 py-2 rounded-xl font-extrabold text-sm border border-blue-700 whitespace-nowrap transition flex items-center gap-2">
                    <i class="fa-solid fa-border-all"></i> Tudo
                </button>
                <button onclick="filterCategory('meds')" id="tab-meds" class="tab-btn bg-blue-900 text-blue-100 px-4 py-2 rounded-xl font-extrabold text-sm border border-blue-800 hover:bg-blue-800 whitespace-nowrap transition flex items-center gap-2">
                    <i class="fa-solid fa-pills text-blue-300"></i> Remédios
                </button>
                <button onclick="filterCategory('agenda')" id="tab-agenda" class="tab-btn bg-blue-900 text-blue-100 px-4 py-2 rounded-xl font-extrabold text-sm border border-blue-800 hover:bg-blue-800 whitespace-nowrap transition flex items-center gap-2">
                    <i class="fa-solid fa-calendar-check text-emerald-400"></i> Consultas
                </button>
                <button onclick="filterCategory('contacts')" id="tab-contacts" class="tab-btn bg-blue-900 text-blue-100 px-4 py-2 rounded-xl font-extrabold text-sm border border-blue-800 hover:bg-blue-800 whitespace-nowrap transition flex items-center gap-2">
                    <i class="fa-solid fa-address-book text-purple-300"></i> Contatos
                </button>
                <button onclick="filterCategory('water')" id="tab-water" class="tab-btn bg-blue-900 text-blue-100 px-4 py-2 rounded-xl font-extrabold text-sm border border-blue-800 hover:bg-blue-800 whitespace-nowrap transition flex items-center gap-2">
                    <i class="fa-solid fa-glass-water text-sky-300"></i> Água
                </button>
            </div>
        </div>
    </header>

    <!-- BANNER DE EMERGÊNCIA SOS FIXO -->
    <section class="bg-gradient-to-r from-red-600 to-red-700 text-white p-4 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-3 text-center sm:text-left">
                <div class="bg-white text-red-600 rounded-full p-3 text-2xl hidden sm:flex items-center justify-center">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <div>
                    <h2 class="text-xl md:text-2xl font-black">PRECISA DE AJUDA URGENTE?</h2>
                    <p class="text-red-100 text-sm font-medium">Ligue para socorro médico ou avise sua família imediatamente.</p>
                </div>
            </div>
            <button onclick="openSosModal()" class="w-full sm:w-auto bg-white text-red-600 hover:bg-red-50 font-black text-lg py-3 px-6 rounded-2xl shadow-lg pulse-sos flex items-center justify-center space-x-2 border-2 border-red-300 active:scale-95 transition">
                <i class="fa-solid fa-phone-flip text-xl"></i>
                <span>SOLICITAR SOCORRO</span>
            </button>
        </div>
    </section>

    <!-- CONTEÚDO PRINCIPAL DIVIDIDO EM DUAS COLUNAS -->
    <main class="max-w-7xl mx-auto w-full flex-grow p-4 md:p-6">
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6" id="main-grid">

            <!-- COLUNA ESQUERDA: REMÉDIOS E ÁGUA -->
            <div class="space-y-6" id="col-left">

                <!-- BLOCO 1: MEUS REMÉDIOS -->
                <section id="section-meds" class="card-bg bg-white rounded-3xl p-5 md:p-6 shadow-md border-2 border-slate-200 space-y-4">
                    <div class="border-b pb-3 flex justify-between items-center gap-2">
                        <div class="flex items-center space-x-3">
                            <div class="bg-blue-100 text-blue-700 p-3 rounded-2xl text-xl font-bold">
                                <i class="fa-solid fa-capsules"></i>
                            </div>
                            <div>
                                <h2 class="text-xl md:text-2xl font-black text-blue-900">1. Remédios do Dia</h2>
                                <p class="text-xs md:text-sm text-slate-600 font-semibold">Toque na caixinha para marcar</p>
                            </div>
                        </div>
                        <div class="flex flex-col items-end gap-1">
                            <span id="med-counter" class="bg-blue-100 text-blue-800 font-black px-3 py-1 rounded-xl text-xs whitespace-nowrap">
                                0/0 Concluídos
                            </span>
                            <button onclick="openAddMedModal()" class="text-xs font-bold text-blue-700 hover:text-blue-900 flex items-center gap-1 border border-blue-200 bg-blue-50 px-2.5 py-1 rounded-lg">
                                <i class="fa-solid fa-plus-circle"></i> Adicionar
                            </button>
                        </div>
                    </div>

                    <!-- Lista de Medicamentos Dinâmica -->
                    <div class="space-y-3" id="med-list">
                        <!-- Carregado via JS -->
                    </div>
                </section>

                <!-- BLOCO 2: HIDRATAÇÃO (CONTADOR DE ÁGUA) -->
                <section id
